name: Dependency compatibility

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint -- --no-fix
      - run: npm run test:dependencies
      - name: Create build-only Firebase configuration
        run: |
          cat > src/config/firebase-config.js <<'EOF'
          export default {
            apiKey: 'build-only-placeholder',
            authDomain: 'demo-like-button.invalid',
            projectId: 'demo-like-button',
            databaseURL: 'https://demo-like-button.invalid',
            storageBucket: 'demo-like-button.invalid',
            messagingSenderId: '000000000000',
            appId: '1:000000000000:web:build-only'
          };
          EOF
      - run: npm run build
